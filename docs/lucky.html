<!-- Games animations -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const cards = document.querySelectorAll('.games_card');
  if (!cards.length) return;
  const ACTIVE_CLASS = 'is-active';
  const INTERVAL = 3000;

  const desktopMQ = window.matchMedia('(min-width: 1024px)');

  let currentIndex = 0;
  let timer = null;

  function setActive(index) {
    cards.forEach(card => card.classList.remove(ACTIVE_CLASS));
    cards[index].classList.add(ACTIVE_CLASS);
    currentIndex = index;
  }

  function startAutoSwitch(startIndex = currentIndex) {
    clearInterval(timer);

    timer = setInterval(() => {
      currentIndex = (currentIndex + 1) % cards.length;
      setActive(currentIndex);
    }, INTERVAL);
  }

  function stopAutoSwitch() {
    clearInterval(timer);
    timer = null;
  }

  function initDesktop() {
    stopAutoSwitch();

    cards.forEach((card, index) => {
      card.onmouseenter = () => {
        setActive(index);
        startAutoSwitch(index);
      };
      card.onclick = null;
    });

    setActive(0);
    startAutoSwitch();
  }

  function initTabletAndMobile() {
    stopAutoSwitch();

    cards.forEach((card, index) => {
      card.onmouseenter = null;
      card.onclick = () => {
        setActive(index);
      };
    });

    setActive(0);
  }

  function checkMode() {
    if (desktopMQ.matches) {
      initDesktop();
    } else {
      initTabletAndMobile();
    }
  }

  desktopMQ.addEventListener('change', checkMode);
  checkMode();
});

</script>

<!-- Keep Home navigation while its dropdown opens on hover -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('[data-nav-menu="home"]').forEach(function (menu) {
    var toggle = menu.querySelector('.nav-drop_title');
    var label = toggle && toggle.firstElementChild;
    if (!label || label.querySelector('.nav-home-anchor')) return;
    var link = document.createElement('a');
    link.className = 'nav-home-anchor';
    link.href = '/';
    link.textContent = label.textContent.trim() || 'Home';
    link.style.cssText = 'color:inherit;text-decoration:none;cursor:pointer';
    label.replaceChildren(link);
    toggle.addEventListener('click', function (event) {
      if (event.target.closest('.nav-home-anchor')) event.stopImmediatePropagation();
    }, true);
    link.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ') event.stopPropagation();
    });
  });
});
</script>
